[package]
name = "status-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# HTTP client (custom hyper-util stack for connect/tls timing + pool gauges)
hyper = { version = "1.9", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http-body = "1"
bytes = "1"
flate2 = "1"
brotli = "8"
socket2 = "0.6"
base64 = "0.22"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "rustls-native-certs", "webpki-tokio"] }

# TLS
rustls = "0.23"
rustls-native-certs = "0.8"
webpki-roots = "1.0"
tokio-rustls = "0.26"

# DNS (custom caching resolver)
hickory-resolver = { version = "0.26", features = ["tls-ring", "tokio"] }

# Storage
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

# ClickHouse for time-series results (optional but recommended)
clickhouse = { version = "0.15", features = ["rustls-tls", "uuid", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Web framework for API + metrics endpoint
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }

# Utilities
uuid = { version = "1.23", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
config = "0.15"
dashmap = "6.1"
parking_lot = "0.12"
governor = "0.10"
backoff = { version = "0.4", features = ["tokio"] }
url = { version = "2.5", features = ["serde"] }
async-trait = "0.1"
fastrand = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rcgen = "0.14"
rustls-pemfile = "2"
tokio-rustls = "0.26"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "circuit_breaker"
harness = false

[[bench]]
name = "batcher_flush"
harness = false

[[bench]]
name = "http_client"
harness = false
