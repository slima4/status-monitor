[package]
name = "status-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "http2",
    "gzip",
    "brotli",
    "stream",
    "hickory-dns",
] }
hyper = { version = "1.9", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }

# TLS
rustls = "0.23"
rustls-native-certs = "0.8"
webpki-roots = "1.0"

# DNS (custom caching resolver)
hickory-resolver = { version = "0.26", features = ["tls-ring", "tokio"] }

# Storage
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

# ClickHouse for time-series results (optional but recommended)
clickhouse = { version = "0.15", features = ["rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Web framework for API + metrics endpoint
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }

# Utilities
uuid = { version = "1.23", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
config = "0.15"
dashmap = "6.1"
parking_lot = "0.12"
governor = "0.10"
backoff = { version = "0.4", features = ["tokio"] }
url = { version = "2.5", features = ["serde"] }
async-trait = "0.1"
fastrand = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
debug = true
strip = false
