{% if sessions.is_empty() %}
<div class="flex items-center gap-3 px-4 py-6 text-sm text-muted">
  <span aria-hidden="true" class="text-base text-quiet">○</span>
  <span>No active sessions.</span>
</div>
{% else %}
<table class="w-full text-left text-sm">
  <thead class="bg-[color:var(--theme-surface-sunk)] text-xs uppercase text-muted">
    <tr>
      <th class="px-4 py-2">Created</th>
      <th class="px-4 py-2">Last used</th>
      <th class="px-4 py-2">Expires</th>
      <th class="px-4 py-2">IP hash</th>
      <th class="px-4 py-2"></th>
    </tr>
  </thead>
  <tbody class="divide-y divide-[color:var(--theme-line)]">
    {% for s in sessions %}
    <tr>
      <td class="px-4 py-2 align-top text-body tabular-nums">{{ s.created }}</td>
      <td class="px-4 py-2 align-top text-body tabular-nums">{{ s.last_used }}</td>
      <td class="px-4 py-2 align-top text-body tabular-nums">{{ s.expires }}</td>
      <td class="px-4 py-2 align-top font-mono text-xs text-muted">{{ s.ip_short }}</td>
      <td class="px-4 py-2 text-right">
        {% if s.is_current %}
        <span class="status-badge status-badge--up">This device</span>
        {% else %}
        <button type="button"
                hx-delete="/api/v1/me/sessions/{{ s.id_hash }}"
                hx-headers='{"X-Requested-With":"status-monitor"}'
                hx-target="#sessions-list"
                hx-swap="innerHTML"
                hx-on::after-request="if(event.detail.successful){htmx.trigger('body','sessions:refresh')}"
                data-confirm-modal
                data-confirm-title="Revoke this session?"
                data-confirm-body="The device using this session is signed out immediately."
                data-confirm-label="Revoke session"
                data-confirm-danger
                class="row-link row-link--danger">Revoke</button>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
