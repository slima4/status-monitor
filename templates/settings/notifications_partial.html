{% if channels.is_empty() %}
<div class="flex items-center gap-3 px-4 py-6 text-sm text-muted">
  <span aria-hidden="true" class="text-base text-quiet">✉</span>
  <span>No notification channels yet — add one above to start receiving alerts.</span>
</div>
{% else %}
<table class="w-full text-left text-sm">
  <thead class="bg-[color:var(--theme-surface-sunk)] text-xs uppercase text-muted">
    <tr>
      <th class="px-4 py-2">Name</th>
      <th class="px-4 py-2">Type</th>
      <th class="px-4 py-2">Status</th>
      <th class="px-4 py-2">Created</th>
      <th class="px-4 py-2"></th>
    </tr>
  </thead>
  <tbody class="divide-y divide-[color:var(--theme-line)]">
    {% for c in channels %}
    <tr>
      <td class="px-4 py-2 align-top text-body">{{ c.name }}</td>
      <td class="px-4 py-2 align-top">
        <span class="status-badge status-badge--tag">{{ c.kind }}</span>
      </td>
      <td class="px-4 py-2 align-top">
        {% if c.enabled %}
        <span class="status-badge status-badge--up">Enabled</span>
        {% else %}
        <span class="status-badge status-badge--disabled">Disabled</span>
        {% endif %}
      </td>
      <td class="px-4 py-2 align-top text-body tabular-nums">{{ c.created }}</td>
      <td class="px-4 py-2">
        <div class="flex items-center justify-end gap-3">
          <span data-test-result class="text-xs"></span>
          <button type="button"
                  hx-post="/api/v1/notification-channels/{{ c.id }}/test"
                  hx-headers='{"X-Requested-With":"status-monitor"}'
                  hx-swap="none"
                  hx-on::after-request="window.smChannelTestResult(this, event)"
                  class="row-link">Send test</button>
          <a href="/settings/notifications/{{ c.id }}/edit"
             class="row-link">Edit</a>
          <button type="button"
                  hx-delete="/api/v1/notification-channels/{{ c.id }}"
                  hx-headers='{"X-Requested-With":"status-monitor"}'
                  hx-on::after-request="if(event.detail.successful){htmx.trigger('body','channels:refresh')}"
                  data-confirm-modal
                  data-confirm-title="Delete notification channel?"
                  data-confirm-body="Monitors bound to {{ c.name }} stop alerting through it. Channel can be re-added later but bindings must be re-applied."
                  data-confirm-label="Delete channel"
                  data-confirm-danger
                  class="row-link row-link--danger">Delete</button>
        </div>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
