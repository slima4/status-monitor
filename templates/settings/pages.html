{% extends "base.html" %}
{% import "_register.html" as reg %}
{% block title %}Status pages · Uptimepage{% endblock %}
{% block content %}
<section class="space-y-6">
  <header class="space-y-1">
    <h1 class="page-title"><span class="page-title__prefix" aria-hidden="true">$</span>status pages</h1>
    <p class="text-sm text-muted">Public uptime dashboards for this organization.</p>
  </header>

  <div id="page-errors" role="alert" aria-live="polite" class="hidden alert-card alert-card--error"></div>

  <div id="pages-list" data-hx-loader
       hx-get="/web/partials/settings/pages"
       hx-trigger="load, pages:refresh from:body"
       hx-swap="innerHTML">
    {% call reg::loading("loading…", "") %}{% endcall %}
  </div>

  <script>
    (() => {
      // "Create" mints a page (published, temp slug) via the existing API,
      // then drops the user into the full page editor to set the real slug,
      // branding, and components. Published by default — until the user
      // renames it, the page is live at the temporary slug URL.
      const errs = document.getElementById('page-errors');
      const showErr = (m) => { errs.textContent = m; errs.classList.remove('hidden'); };
      const genSlug = () => {
        let s = '';
        for (let i = 0; i < 10; i++) s += Math.floor(Math.random() * 36).toString(36);
        return 'page-' + s; // page-<10×[0-9a-z]> — always slug-valid; collisions retry
      };
      window.smCreateDraftPage = async (btn) => {
        errs.classList.add('hidden');
        if (btn) btn.disabled = true;
        for (let attempt = 0; attempt < 4; attempt++) {
          let res, data;
          try {
            const slug = genSlug();
            res = await fetch('/api/v1/status-pages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'uptimepage' },
              body: JSON.stringify({ name: slug, slug, enabled: true }),
            });
            data = await res.json().catch(() => null);
          } catch (_) {
            showErr('network error — try again.');
            if (btn) btn.disabled = false;
            return;
          }
          if (res.ok && data && data.id) {
            window.location.href = '/settings/pages/' + data.id;
            return;
          }
          if (data && data.error && data.error.code === 'SLUG_TAKEN') continue; // rare temp-slug collision — retry
          showErr((data && data.error && data.error.message) || 'could not create page.');
          if (btn) btn.disabled = false;
          return;
        }
        showErr('could not allocate a unique URL — try again.');
        if (btn) btn.disabled = false;
      };
    })();
  </script>
</section>
{% endblock %}
