<div id="sessions-list"
     hx-get="/web/partials/settings/sessions"
     hx-trigger="load, every 60s, sessions:refresh from:body"
     hx-swap="innerHTML"
     class="sticker-card overflow-hidden">
  <p class="px-4 py-3 text-sm text-slate-500">Loading…</p>
</div>

<button type="button"
        hx-post="/auth/logout-all"
        hx-headers='{"X-Requested-With":"status-monitor"}'
        hx-on::after-request="window.location.href='/login'"
        data-confirm-modal
        data-confirm-title="Log out everywhere?"
        data-confirm-body="Every active session for this account is signed out, including this one. You will need to sign in again."
        data-confirm-label="Log out everywhere"
        data-confirm-danger
        class="btn-ghost btn-ghost--danger px-3 py-1.5 text-sm font-medium">
  Log out everywhere
</button>
