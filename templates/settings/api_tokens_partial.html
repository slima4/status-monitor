<table class="w-full text-left text-sm">
  <thead class="bg-[color:var(--theme-surface-sunk)] text-xs uppercase text-muted">
    <tr>
      <th class="px-4 py-2">Name</th>
      <th class="px-4 py-2">Prefix</th>
      <th class="px-4 py-2">Created</th>
      <th class="px-4 py-2">Last used</th>
      <th class="px-4 py-2"></th>
    </tr>
  </thead>
  <tbody class="divide-y">
    {% for t in tokens %}
    <tr>
      <td class="px-4 py-2 align-top text-body">{{ t.name }}</td>
      <td class="px-4 py-2 align-top font-mono text-xs text-muted">{{ t.prefix }}…</td>
      <td class="px-4 py-2 align-top text-body">{{ t.created }}</td>
      <td class="px-4 py-2 align-top text-body">{{ t.last_used }}</td>
      <td class="px-4 py-2 text-right">
        <button type="button"
                hx-delete="/api/v1/me/api-tokens/{{ t.id }}"
                hx-headers='{"X-Requested-With":"status-monitor"}'
                hx-on::after-request="if(event.detail.successful){htmx.trigger('body','tokens:refresh')}"
                data-confirm-modal
                data-confirm-title="Revoke API token?"
                data-confirm-body="Token {{ t.name }} can no longer be used. Existing callers receive 401 on the next request. Cannot be undone."
                data-confirm-label="Revoke token"
                data-confirm-danger
                class="row-link row-link--danger">Revoke</button>
      </td>
    </tr>
    {% endfor %}
    {% if tokens.is_empty() %}
    <tr><td colspan="5" class="px-4 py-3 text-sm text-muted">No tokens yet.</td></tr>
    {% endif %}
  </tbody>
</table>
