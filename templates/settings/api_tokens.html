{% extends "base.html" %}
{% block title %}API tokens · Status Monitor{% endblock %}
{% block content %}
<section class="space-y-6">
  <header class="space-y-1">
    <h1 class="text-2xl font-semibold tracking-tight">API tokens</h1>
    <p class="text-sm text-slate-500">
      Bearer tokens for scripting against <code>/api/v1/*</code>. The full token
      is shown <strong>once</strong> when you create it — store it now.
    </p>
  </header>

  <form id="new-token-form"
        hx-post="/api/v1/me/api-tokens"
        hx-ext="json-enc"
        hx-headers='{"X-Requested-With":"status-monitor"}'
        hx-target="#token-result"
        hx-swap="innerHTML"
        class="flex flex-wrap items-center gap-2 rounded border bg-white p-4">
    <label class="sr-only" for="token-name">Token name</label>
    <input id="token-name" name="name" type="text" required minlength="1" maxlength="80"
           placeholder="CI deploy, my laptop, …"
           class="flex-1 rounded border px-3 py-1.5 text-sm">
    <button type="submit"
            class="rounded bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700">
      Create token
    </button>
  </form>

  <div id="token-result" aria-live="polite"></div>

  <div id="tokens-list"
       hx-get="/web/partials/settings/api-tokens"
       hx-trigger="load, every 60s, tokens:refresh from:body"
       hx-swap="innerHTML"
       class="rounded border bg-white">
    <p class="px-4 py-3 text-sm text-slate-500">Loading…</p>
  </div>

  <script>
    document.body.addEventListener('htmx:afterRequest', (ev) => {
      const elt = ev.detail.elt;
      if (!elt) return;
      if (elt.id === 'new-token-form' && ev.detail.successful) {
        const xhr = ev.detail.xhr;
        try {
          const body = JSON.parse(xhr.responseText);
          const result = document.getElementById('token-result');
          result.innerHTML = `
            <div class="rounded border border-emerald-300 bg-emerald-50 p-4 text-sm">
              <p class="font-medium text-emerald-900">Token created — copy it now, you won't see it again.</p>
              <pre class="mt-2 overflow-x-auto rounded bg-white px-3 py-2 font-mono text-xs">${body.token}</pre>
            </div>`;
          document.getElementById('token-name').value = '';
          htmx.trigger('body', 'tokens:refresh');
        } catch (e) { /* leave server response in place */ }
      }
    });
  </script>
</section>
{% endblock %}
