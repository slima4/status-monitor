{% extends "base.html" %}
{% block title %}Welcome · Uptimepage{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl space-y-6 sticker-card p-8">
  <header class="space-y-2">
    <h1 class="page-title"><span class="page-title__prefix" aria-hidden="true">$</span>welcome, {{ display_name }}.</h1>
    <p class="text-sm text-muted" style="line-height: 1.6;">
      We created an organization for you. Pick a name your team will
      recognize, or keep the placeholder.
    </p>
  </header>

  <form id="onboard-form"
        hx-patch="/api/v1/orgs/{{ org_id }}"
        hx-ext="json-enc"
        hx-headers='{"X-Requested-With":"uptimepage"}'
        hx-target="#onboard-status"
        hx-swap="innerHTML"
        novalidate
        class="space-y-3">
    <label class="block text-sm font-medium" for="org-name">Organization name</label>
    <input id="org-name" name="name" type="text" value="{{ current_name }}"
           required minlength="1" maxlength="80" autocomplete="off"
           class="w-full field text-sm">
    <div class="flex items-center justify-between">
      <a id="skip-onboard" href="/" class="text-sm text-muted hover:text-body transition-colors">skip for now</a>
      <button type="submit" hx-disabled-elt="this"
              class="sticker-btn sticker-btn--primary px-3 py-1.5 text-sm font-medium">
        save and continue
      </button>
    </div>
    <p id="onboard-status" class="flash-text flash-text--ok" aria-live="polite"></p>
  </form>

  <script>
    (function () {
      function markComplete() {
        return fetch('/api/v1/me/onboarding/complete', {
          method: 'POST',
          headers: { 'X-Requested-With': 'uptimepage' },
        }).catch(function () { /* best effort */ });
      }

      document.body.addEventListener('htmx:afterRequest', function (ev) {
        if (ev.detail.elt && ev.detail.elt.id === 'onboard-form' && ev.detail.successful) {
          markComplete().finally(function () {
            setTimeout(function () { window.location.href = '/'; }, 600);
          });
        }
      });

      const skip = document.getElementById('skip-onboard');
      skip.addEventListener('click', function (ev) {
        ev.preventDefault();
        markComplete().finally(function () { window.location.href = '/'; });
      });
    })();
  </script>
</section>
{% endblock %}
