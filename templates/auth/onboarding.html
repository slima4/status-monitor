{% extends "base.html" %}
{% block title %}Welcome · Status Monitor{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl space-y-6 sticker-card p-8">
  <header class="space-y-2">
    <h1 class="page-title">Welcome, {{ display_name }}.</h1>
    <p class="text-sm text-muted" style="line-height: 1.6;">
      We created an organization for you. Pick a name your team will
      recognize, or keep the placeholder.
    </p>
  </header>

  <form id="onboard-form"
        hx-patch="/api/v1/orgs/{{ org_id }}"
        hx-ext="json-enc"
        hx-headers='{"X-Requested-With":"status-monitor"}'
        hx-target="#onboard-status"
        hx-swap="innerHTML"
        class="space-y-3">
    <label class="block text-sm font-medium" for="org-name">Organization name</label>
    <input id="org-name" name="name" type="text" value="{{ current_name }}"
           required minlength="1" maxlength="80"
           class="w-full field text-sm">
    <div class="flex items-center justify-between">
      <a href="/" class="text-sm text-muted hover:text-body transition-colors">Skip for now</a>
      <button type="submit"
              class="sticker-btn sticker-btn--primary px-4 py-2 text-sm font-medium transition-transform hover:-translate-y-0.5">
        Save and continue
      </button>
    </div>
    <p id="onboard-status" class="flash-text flash-text--ok" aria-live="polite"></p>
  </form>

  <script>
    document.body.addEventListener('htmx:afterRequest', (ev) => {
      if (ev.detail.elt && ev.detail.elt.id === 'onboard-form' && ev.detail.successful) {
        setTimeout(() => { window.location.href = '/'; }, 600);
      }
    });
  </script>
</section>
{% endblock %}
