<form id="magic-link-form" class="space-y-3 pt-3" novalidate data-last-used="{{ last_magic }}">
  <label class="sr-only" for="magic-link-email">Email address</label>
  <input id="magic-link-email" name="email" type="email" required autocomplete="email"
         placeholder="you@company.com" spellcheck="false"
         class="w-full field">
  <button type="submit"
          class="sticker-btn sticker-btn--accent inline-flex w-full items-center justify-center gap-2 px-4 py-2.5 text-sm font-medium">
    email me a sign-in link
  </button>
  <div id="magic-link-error" role="alert" aria-live="polite"
       class="hidden alert-card alert-card--error"></div>
</form>
<p id="magic-link-sent" class="alert-card alert-card--muted hidden text-sm">
  Check your inbox &mdash; if that address has an account, a sign-in link is
  on its way. The link works once and expires in
  {{ magic_link_expiry_minutes }} minutes. Nothing arrived? You can
  request another shortly.
</p>
