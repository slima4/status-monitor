<div class="monitors-menu" data-org-picker>
    <button type="button"
            class="nav-link"
            data-picker-toggle
            aria-haspopup="menu"
            aria-expanded="false"
            aria-label="Switch organization — current: {{ current_slug }}">
        <span class="cli-brackets">{{ current_slug }} ▾</span>
    </button>
    <div class="monitors-popover" role="menu" hidden data-picker-panel>
        {% for o in orgs %}
        <button type="button"
                class="monitors-popover__item"
                role="menuitem"
                data-org-switch="{{ o.id }}"
                {% if o.is_active %}aria-current="true"{% endif %}>{{ o.slug }}</button>
        {% endfor %}
    </div>
</div>
