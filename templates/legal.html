<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · uptimepage</title>
    <meta name="robots" content="index,follow">
    <link rel="icon" type="image/svg+xml" href="{{ "img/favicon.svg"|asset }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "img/favicon.png"|asset }}">
    <link rel="apple-touch-icon" href="{{ "img/apple-touch-icon.png"|asset }}">
    <link rel="stylesheet" href="{{ "css/app.css"|asset }}">
</head>
<body class="app-shell antialiased">
    <header class="border-b border-[color:var(--theme-line)] bg-[color:var(--theme-surface)]">
        <nav aria-label="Primary" class="container mx-auto flex items-center gap-6 px-4 py-3">
            {% include "_nav_brand.html" %}
        </nav>
    </header>
    <main class="container mx-auto max-w-3xl px-4 py-8">
        <article class="legal-doc">{{ body|safe }}</article>
    </main>
    <footer class="container mx-auto px-4 py-6 text-xs text-quiet">
        {% include "_footer_links.html" %}
    </footer>
</body>
</html>
