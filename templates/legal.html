<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · status-monitor</title>
    <meta name="robots" content="index,follow">
    <link rel="icon" type="image/svg+xml" href="{{ "img/favicon.svg"|asset }}">
    <link rel="stylesheet" href="{{ "css/app.css"|asset }}">
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
    <header class="border-b bg-white">
        <nav aria-label="Primary" class="container mx-auto flex items-center gap-6 px-4 py-3">
            <a href="/" class="font-semibold tracking-tight">Status Monitor</a>
            <a href="/docs" class="ml-auto text-sm text-slate-500 hover:text-slate-700">API docs</a>
        </nav>
    </header>
    <main class="container mx-auto max-w-3xl px-4 py-8">
        <article class="legal-doc">{{ body|safe }}</article>
    </main>
    <footer class="container mx-auto px-4 py-6 text-xs text-slate-400">
        {% include "_legal_links.html" %}
    </footer>
</body>
</html>
