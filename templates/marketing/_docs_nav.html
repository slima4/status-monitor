<details class="mk-doc-nav" open>
    <summary class="mk-doc-nav__summary">documentation<span class="mk-navgrp__caret" aria-hidden="true"></span></summary>
    <nav class="mk-doc-nav__body" aria-label="Documentation" data-link-region="docs-nav">
        <a href="/docs" class="mk-doc-nav__home{% if current.is_empty() %} is-active{% endif %}"{% if current.is_empty() %} aria-current="page"{% endif %}>all docs</a>
        {% for section in sections %}
        <p class="mk-doc-nav__head">{{ section.label }}</p>
        <ul class="mk-doc-nav__list">
            {% for item in section.items %}
            <li>
                <a href="{{ item.href }}" class="mk-doc-nav__link{% if item.slug == current %} is-active{% endif %}"{% if item.slug == current %} aria-current="page"{% endif %}>
                    {{ item.title }}
                    {% if let Some(b) = item.badge %}<span class="mk-doc-badge">{{ b }}</span>{% endif %}
                </a>
            </li>
            {% endfor %}
        </ul>
        {% endfor %}
    </nav>
</details>
