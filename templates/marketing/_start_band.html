{# /start normalises the URL and hands it to login. No JS: it is a 302.
   `start_band_position` names the placement for analytics. #}
<section aria-label="Start monitoring" class="mk-start-band">
    <form class="mk-start" method="get" action="/start">
        <label class="sr-only" for="mk-start-url">The site or API you want watched</label>
        <span class="mk-start__field">
            <span class="mk-start__prompt" aria-hidden="true">&gt;</span>
            <input class="mk-start__input" id="mk-start-url" name="url" type="text"
                   inputmode="url" autocomplete="url" spellcheck="false"
                   autocapitalize="off" maxlength="512"
                   placeholder="yoursite.com">
        </span>
        <button type="submit" class="mk-cta mk-cta--primary" data-umami-event="signup-start" data-umami-event-position="{{ start_band_position }}">
            monitor it
            <svg class="mk-cta__arrow h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h15"/>
            </svg>
        </button>
    </form>
</section>
