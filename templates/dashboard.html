{% extends "base.html" %}
{% block title %}Dashboard · Status Monitor{% endblock %}
{% block content %}
<section class="space-y-6">
  <header class="space-y-1">
    <h1 class="text-2xl font-semibold tracking-tight">Dashboard</h1>
    <p class="text-sm text-slate-500">Live fleet snapshot. Auto-refreshes every 5 seconds.</p>
  </header>

  {% include "dashboard/region.html" %}

  <section class="grid gap-4 md:grid-cols-2">
    <div class="rounded border bg-white p-4">
      <h2 class="text-sm font-medium text-slate-700">Status distribution</h2>
      <div id="status-donut"
           class="mt-3 h-64 w-full"
           data-endpoint="/api/v1/dashboard/summary"
           aria-label="Donut chart of target status distribution"></div>
    </div>
    <div class="rounded border bg-white p-4">
      <h2 class="text-sm font-medium text-slate-700">Last 24h checks</h2>
      <div id="last24h-bar"
           class="mt-3 h-64 w-full"
           data-endpoint="/api/v1/dashboard/summary"
           aria-label="Bar chart of up vs not-up checks in the last 24 hours"></div>
    </div>
  </section>
</section>

<script defer src="{{ "js/echarts.min.js"|asset }}"></script>
<script type="module" src="{{ "js/charts/dashboard.js"|asset }}"></script>
{% endblock %}
