{% extends "base.html" %}
{% block title %}Dashboard · Uptimepage{% endblock %}
{% block content %}
<section class="space-y-5">
  <header class="flex flex-wrap items-end justify-between gap-3">
    <div class="flex items-center gap-3">
      <h1 class="page-title"><span class="page-title__prefix" aria-hidden="true">$</span>dashboard</h1>
      <span class="dashboard-chip">refresh · 5s</span>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <a href="/targets/new"
         class="sticker-btn sticker-btn--primary px-3 py-1.5 text-sm font-medium">
        + monitor
      </a>
    </div>
  </header>

  {% if onboarding %}
  {% include "_empty_monitors_hero.html" %}
  {% else %}
  {% include "dashboard/table.html" %}
  {% endif %}
</section>
{% endblock %}
