{# Rendered hidden and revealed by the script, so a dismissed panel never flashes. #}
<section class="sticker-card overflow-hidden" data-coverage="{{ cov.host }}"
         aria-labelledby="coverage-heading" hidden>
  <header class="card-band flex flex-wrap items-center justify-between gap-2">
    <h2 id="coverage-heading" class="panel-label">also worth watching</h2>
    <button type="button" data-coverage-dismiss
            class="btn-ghost coverage-dismiss px-2 py-1 text-xs font-medium">dismiss</button>
  </header>

  <div class="space-y-3 p-5">
    <p class="text-pretty text-xs text-muted">
      This monitor proves the service answers. These are the failures it would
      keep answering through.
    </p>

    <div class="check-type-cards">
      {% for c in cov.items %}
      <a href="{{ c.href }}" class="check-type-card h-full min-w-0"
         aria-label="Add {{ c.what }} for {{ c.host }}. {{ c.why }}">
        <span class="check-type-card__name">{{ c.label }}</span>
        <span class="check-type-card__desc w-full truncate" title="{{ c.host }}">{{ c.host }}</span>
        <span class="check-type-card__desc">{{ c.why }}</span>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
<script defer src="{{ "js/ui/coverage_hint.js"|asset }}"></script>
