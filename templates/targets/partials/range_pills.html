{# Shares `.range-tabs` with the dashboard. Inputs: `range_options`
   (Vec<RangeOption>), `range_base_path`, `from_iso`, `to_iso`,
   `from_human`, `to_human`. #}
<div class="flex flex-wrap items-center gap-3 pt-3">
  <div class="range-tabs" role="tablist" aria-label="Time range">
    {% for opt in range_options %}
    <a href="{{ range_base_path }}?range={{ opt.key }}"
       role="tab"
       class="range-tabs__btn{% if opt.selected %} range-tabs__btn--active{% endif %}"
       aria-selected="{% if opt.selected %}true{% else %}false{% endif %}"
       {% if opt.selected %}aria-current="page"{% endif %}>{{ opt.key }}</a>
    {% endfor %}
  </div>
  <span class="range-tabs-meta"><time datetime="{{ from_iso }}" data-tz="exact">{{ from_human }}</time> → <time datetime="{{ to_iso }}" data-tz="exact">{{ to_human }}</time></span>
</div>
