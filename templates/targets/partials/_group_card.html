<details class="monitors-group" data-group-name="{{ gb.name }}" open>
  <summary class="monitors-group__head">
    <span class="monitors-group__chevron" aria-hidden="true">›</span>
    <span class="monitors-dot{% if gb.worst_status != "" %} monitors-dot--{{ gb.worst_status }}{% endif %}{% if gb.worst_status == "down" || gb.worst_status == "error" %} monitors-dot--pulse{% endif %}" aria-hidden="true"></span>
    <span class="monitors-group__title">{{ gb.name }}</span>
    <span class="monitors-group__meta">
      {{ gb.total }} monitor{% if gb.total != 1 %}s{% endif %}
      ·<span class="monitors-group__meta-mono">{{ gb.avg_uptime_label }}</span> avg uptime
    </span>
    <span class="monitors-group__pips" aria-hidden="true">
      {% for r in gb.rows %}
      <span class="monitors-group__pip{% if r.status_class != "" %} monitors-group__pip--{{ r.status_class }}{% endif %}{% if !r.enabled %} monitors-group__pip--paused{% endif %}" title="{{ r.name }}"></span>
      {% endfor %}
    </span>
  </summary>
  <div class="monitors-table" role="table" aria-label="{{ gb.name }} monitors">
    <div class="monitors-head" role="row">
      <span><input type="checkbox" data-group-select aria-label="Select all in {{ gb.name }}"></span>
      <span></span>
      <span>Monitor</span>
      <span>Type</span>
      <span>Tags</span>
      <span>Last check</span>
      <span class="text-right">30d uptime</span>
      <span>Owner</span>
      <span></span>
    </div>
    {% for row in gb.rows %}
    {% include "targets/partials/_row.html" %}
    {% endfor %}
  </div>
</details>
