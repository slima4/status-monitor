services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: monitor
      CLICKHOUSE_PASSWORD: monitor
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  status-monitor:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    environment:
      STATUS_MONITOR_STORAGE__POSTGRES__URL: postgres://monitor:monitor@postgres:5432/monitor
      STATUS_MONITOR_STORAGE__CLICKHOUSE__URL: http://clickhouse:8123
      STATUS_MONITOR_STORAGE__CLICKHOUSE__USER: monitor
      STATUS_MONITOR_STORAGE__CLICKHOUSE__PASSWORD: monitor
      STATUS_MONITOR_OBSERVABILITY__LOG_FORMAT: json
    ports:
      - "8080:8080"
      - "9090:9090"

  # Mock-server + client live in the same process; nothing external is needed.
  # Linux container exposes the kernel knobs macOS loopback can't (ephemeral
  # range, somaxconn, tw_reuse), unlocking the §10.7 50k-concurrent acceptance.
  # Run: docker compose --profile loadtest run --rm loadtest
  loadtest:
    profiles: ["loadtest"]
    build:
      context: .
    entrypoint: ["/usr/local/bin/loadtest"]
    environment:
      CONCURRENCY: "50000"
      DURATION_SECS: "300"
      TIMEOUT_MS: "5000"
      MOCK_PORTS: "16"
      RAMP_SECS: "10"
      HTTP2: "1"
      RUST_LOG: "info"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      net.core.somaxconn: "8192"
      net.ipv4.tcp_tw_reuse: "1"
      net.ipv4.ip_local_port_range: "10000 65535"
      net.ipv4.tcp_fin_timeout: "15"

volumes:
  pg_data:
  ch_data:
