name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "book.toml"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "book.toml"
      - "*.md"
  workflow_dispatch:

# Cancel superseded runs on the same ref. A push that lands while the
# previous one is still building (rebase, force-push, fast follow-ups)
# kills the in-flight job rather than burning runner minutes on a stale
# commit. `main` is left alone — every commit on it runs to completion
# so the canonical history's status checks aren't truncated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Linker comes from .cargo/config.toml (one fingerprint everywhere);
      # sccache caches compilation, rust-cache keeps only the registry
      # (cache-targets: false) so the two don't double-store target/.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.95
          cache-targets: "false"
      - name: fetch tailwind cli
        run: scripts/fetch-tailwind.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: install ast-grep
        env:
          AST_GREP_VERSION: "0.42.1"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/ast-grep.zip" \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          unzip -q "$tmp/ast-grep.zip" -d "$tmp"
          install -m 0755 "$tmp/ast-grep" /usr/local/bin/ast-grep
          ast-grep --version
      - name: tenant-isolation check
        run: scripts/check_tenant_isolation.sh

  # License + advisory + ban + source audit. Independent of the build,
  # uses its own cache, runs in parallel with `lint` and `test`. Pinned
  # to a tagged release of the action so a compromised `main` on the
  # action repo can't silently change scanning behaviour.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2.0.18
        with:
          command: check advisories bans licenses sources

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_DB: monitor
          CLICKHOUSE_USER: monitor
          CLICKHOUSE_PASSWORD: monitor
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget -q --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://monitor:monitor@127.0.0.1:5432/monitor
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USER: monitor
      CLICKHOUSE_PASSWORD: monitor
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.95
          cache-targets: "false"
      - name: fetch tailwind cli
        run: scripts/fetch-tailwind.sh
      # The logging-privacy audit (tests/logging_audit_test.rs) shells out to
      # ast-grep, so the test job needs it too — not just lint.
      - name: install ast-grep
        env:
          AST_GREP_VERSION: "0.42.1"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/ast-grep.zip" \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          unzip -q "$tmp/ast-grep.zip" -d "$tmp"
          install -m 0755 "$tmp/ast-grep" /usr/local/bin/ast-grep
          ast-grep --version
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2.77.7
        with:
          tool: cargo-nextest
      - name: unit + non-network integration tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: pg + ch backed integration tests
        run: cargo nextest run --workspace --locked --no-fail-fast --run-ignored=only
      - name: doctests (nextest doesn't run them)
        run: cargo test --workspace --locked --doc
