name: indexnow

# Manually notify IndexNow (Bing; DuckDuckGo via Bing) that the
# marketing URLs changed, so they recrawl sooner. Run after a deploy that
# changed marketing content. Advisory: the sitemap is the durable signal, so
# a missed run only delays recrawl. Needs repo Variable INDEXNOW_KEY (public),
# matching the key Caddy serves at https://<origin>/<key>.txt.

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin to submit (scheme + host, no trailing slash)
        required: false
        default: https://uptimepage.dev

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: submit to IndexNow
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          ORIGIN: ${{ inputs.origin }}
        run: |
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "::error::repo Variable INDEXNOW_KEY is not set"
            exit 1
          fi
          bash deployment/scripts/indexnow-ping.sh
