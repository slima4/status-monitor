name: deploy

# Continuous deploy to production (Hetzner / uptimepage.dev).
#
# Two ways in:
#   • automatic — chains off a successful `release-image` build on main, and
#     only proceeds if the branch-push `ci` run is ALSO green for the same
#     commit (enforced in the "ci gate" step). The auto path pins the remote
#     working tree AND the image to that commit's sha, and never re-migrates
#     (REMIGRATE is forced false) — so it is safe ONLY for new/additive
#     migrations. A push that edits an already-applied migration in place
#     (pre-launch policy) will NOT self-heal — run this workflow manually with
#     remigrate=true to drop + rebuild the DB for that change.
#   • manual — `workflow_dispatch`: pick any image tag and optionally the
#     destructive remigrate. Manual runs skip the ci gate (human asserts it).
#
# Required repo secrets (Settings → Secrets → Actions; none committed):
#   DEPLOY_SSH_KEY      private key for the deploy@ user (the gitignored
#                       `hetzner` key — its contents, never committed)
#   DEPLOY_HOST         deploy host (IP or DNS)
#   DEPLOY_USER         ssh user (deploy)
#   DEPLOY_KNOWN_HOSTS  pinned host key line(s) from `ssh-keyscan <host>`
#                       — pins the server identity so the run cannot be MITM'd
#                       (no StrictHostKeyChecking=off anywhere below)
#
# Optional repo secrets — each group is upserted into the server .env
# only when its values are all set; unset = that signal stays off.
# One access-policy token (GRAFANA_CLOUD_API_TOKEN) backs all three
# signals — it just needs the matching scopes (metrics:write +
# traces:write + logs:write) on the policy.
#   Metrics (Alloy sidecar → Grafana Cloud Prometheus):
#     GRAFANA_CLOUD_PROM_URL    remote_write endpoint
#     GRAFANA_CLOUD_PROM_USER   Prometheus numeric instance id
#     GRAFANA_CLOUD_API_TOKEN   access-policy token (sensitive)
#   Traces (in-app OTLP/HTTP → Grafana Cloud Tempo):
#     GRAFANA_OTLP_ENDPOINT     OTLP gateway base url
#     GRAFANA_OTLP_INSTANCE_ID  OTLP numeric instance id (≠ Prom id)
#     GRAFANA_OTLP_API_TOKEN    access-policy token (sensitive)
#   Logs (Alloy sidecar → Grafana Cloud Loki; rides the metrics sidecar):
#     GRAFANA_CLOUD_LOKI_URL    Loki push endpoint
#     GRAFANA_CLOUD_LOKI_USER   Loki numeric instance id (≠ Prom id)
#     (token: reuses GRAFANA_CLOUD_API_TOKEN, needs logs:write)
#   Deploy annotation (best-effort marker on Grafana dashboards):
#     GRAFANA_ANNOTATIONS_URL   https://<stack>.grafana.net/api/annotations
#     GRAFANA_ANNOTATIONS_TOKEN Grafana service-account token with the
#                               annotations:write role (NOT a glc_ token)
# Non-secret repo variable: RUST_LOG (log/trace verbosity, redeploy
# applies it with no rebuild).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-<full40>, v1.2.3, latest)"
        required: true
        type: string
      remigrate:
        description: "DESTRUCTIVE: drop + re-create the Postgres database, then let the app re-run all migrations from scratch. Wipes orgs/users/targets. Pre-launch only. ClickHouse is untouched."
        required: true
        type: boolean
        default: false
      remigrate_clickhouse:
        description: "DESTRUCTIVE: drop the ClickHouse data volume — wipes all check-result history + rollups; the app re-applies CH migrations on the fresh volume. Postgres untouched."
        required: true
        type: boolean
        default: false
  workflow_run:
    workflows: [release-image]
    types: [completed]
    branches: [main]

# One deploy at a time — never let two runs race on the box / .env.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Manual runs always proceed; auto runs only when the image build that
    # triggered us actually succeeded (the ci-green gate is the next step).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read # read ci.yml run conclusion for the gate
      packages: read # pull the app image from GHCR (org keeps it private)
    environment: production # attach required-reviewer / protection rules via the GitHub env
    env:
      # Auto path: deploy the exact commit that was built, never re-migrate.
      # Manual path: operator-chosen tag + opt-in destructive remigrate.
      IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.event.workflow_run.head_sha) }}
      REMIGRATE: ${{ inputs.remigrate || false }}
      REMIGRATE_CH: ${{ inputs.remigrate_clickhouse || false }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      # Single source of truth, mirrored from release-image.yml.
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: ci gate
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$HEAD_SHA" ] || { echo "::error::empty head_sha on auto path"; exit 1; }
          # Assert the branch-PUSH ci run (the same event release-image gates
          # on) is green for this exact commit — event=push so a weaker
          # pull_request / dispatch ci run can't satisfy the gate. ci (~5-9m)
          # normally concludes before release-image (~12-14m), so this usually
          # passes on the first probe; poll a few times for a ci tail-run.
          for i in $(seq 1 12); do
            c=$(gh api \
              "repos/${IMAGE_NAME}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&branch=main&event=push&per_page=1" \
              --jq '.workflow_runs[0] | (.status + ":" + (.conclusion // "null"))' 2>/dev/null || echo "none:null")
            case "$c" in
              completed:success) echo "ci green for ${HEAD_SHA}"; exit 0 ;;
              completed:*)       echo "::error::ci not green for ${HEAD_SHA} (${c}) — blocking autodeploy"; exit 1 ;;
              *)                 echo "ci not concluded yet (${c}); waiting…"; [ "$i" -lt 12 ] && sleep 30 ;;
            esac
          done
          echo "::error::ci did not conclude for ${HEAD_SHA} within ~6m — blocking autodeploy"
          exit 1

      - name: validate image tag
        run: |
          set -euo pipefail
          # The classic footgun: a SHORT git sha as image_tag. The .env
          # image bump would write a tag GHCR never published; the pull
          # 404s and the deploy aborts AFTER .env was already rewritten,
          # leaving the box unable to recreate the app until that line is
          # hand-fixed. release-image only ever publishes the full 40-hex
          # sha-<40>. Non-sha tags (semver, latest) are unconstrained and
          # pass through. The auto path's sha-<head_sha> is full-length,
          # so this also fails closed if a runner ever yields a short sha.
          [ -n "$IMAGE_TAG" ] || { echo "::error::image_tag resolved empty"; exit 1; }
          case "$IMAGE_TAG" in
            sha-*)
              if ! printf '%s' "${IMAGE_TAG#sha-}" | grep -qiE '^[0-9a-f]{40}$'; then
                echo "::error::image_tag '$IMAGE_TAG' is a short/invalid sha — it must be sha-<full 40-hex commit sha> (release-image publishes only that tag). Re-dispatch with the full sha."
                exit 1
              fi
              ;;
          esac
          echo "image tag ok: $IMAGE_TAG"

      - name: load ssh key + pinned host key
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_deploy <<< "${{ secrets.DEPLOY_SSH_KEY }}"
          install -m 600 /dev/stdin ~/.ssh/known_hosts <<< "${{ secrets.DEPLOY_KNOWN_HOSTS }}"

      - name: deploy over ssh
        # All ${{ }} live here, never inline in the run block below: GitHub caps
        # an expression-bearing string at 21000 chars and this block is large,
        # so an inline ${{ }} makes the whole script one over-long expression and
        # the file fails to parse. As $ENV refs the block stays expression-free.
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAFANA_CLOUD_PROM_URL: ${{ secrets.GRAFANA_CLOUD_PROM_URL }}
          GRAFANA_CLOUD_PROM_USER: ${{ secrets.GRAFANA_CLOUD_PROM_USER }}
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
          GRAFANA_OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
          GRAFANA_OTLP_INSTANCE_ID: ${{ secrets.GRAFANA_OTLP_INSTANCE_ID }}
          GRAFANA_OTLP_API_TOKEN: ${{ secrets.GRAFANA_OTLP_API_TOKEN }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USER: ${{ secrets.GRAFANA_CLOUD_LOKI_USER }}
          RUST_LOG: ${{ vars.RUST_LOG }}
          UPTIMEPAGE_MCP_ENABLED: ${{ vars.MCP_ENABLED }}
          UPTIMEPAGE_MCP_OAUTH_ENABLED: ${{ vars.MCP_OAUTH_ENABLED }}
        run: |
          set -euo pipefail
          # Lowercase only the repo (GHCR requires it); OCI tags are
          # case-sensitive so the tag is passed through verbatim.
          NEW_IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):${IMAGE_TAG}"
          # Grafana Cloud creds (optional). Inlined into the remote command
          # env like NEW_IMAGE — GitHub masks registered secret values in
          # the run log; no `set -x` is enabled around them. Unset secrets
          # pass through as empty and the remote skips the matching block.
          # Independent signals: the metrics trio + Loki pair drive the
          # Alloy sidecar; the OTLP trio drives in-app trace export.
          # Tokens are written to the server .env (same trust tier as the
          # KEK already there), never committed.
          ssh -T -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "NEW_IMAGE='${NEW_IMAGE}' REMIGRATE='${REMIGRATE}' REMIGRATE_CH='${REMIGRATE_CH}' HEAD_SHA='${HEAD_SHA}' \
               GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' \
               GRAFANA_CLOUD_PROM_URL='${GRAFANA_CLOUD_PROM_URL}' \
               GRAFANA_CLOUD_PROM_USER='${GRAFANA_CLOUD_PROM_USER}' \
               GRAFANA_CLOUD_API_TOKEN='${GRAFANA_CLOUD_API_TOKEN}' \
               GRAFANA_OTLP_ENDPOINT='${GRAFANA_OTLP_ENDPOINT}' \
               GRAFANA_OTLP_INSTANCE_ID='${GRAFANA_OTLP_INSTANCE_ID}' \
               GRAFANA_OTLP_API_TOKEN='${GRAFANA_OTLP_API_TOKEN}' \
               GRAFANA_CLOUD_LOKI_URL='${GRAFANA_CLOUD_LOKI_URL}' \
               GRAFANA_CLOUD_LOKI_USER='${GRAFANA_CLOUD_LOKI_USER}' \
               RUST_LOG='${RUST_LOG}' \
               UPTIMEPAGE_MCP_ENABLED='${UPTIMEPAGE_MCP_ENABLED}' \
               UPTIMEPAGE_MCP_OAUTH_ENABLED='${UPTIMEPAGE_MCP_OAUTH_ENABLED}' \
               bash -s" <<'REMOTE'
          # This script is delivered to `bash -s` over the ssh heredoc — i.e. on
          # stdin (fd 0). A `docker compose exec -T` / `docker exec -i` / nested
          # `ssh` run directly would inherit fd 0 and drain the rest of the
          # script as its own stdin, silently skipping every later command (the
          # Caddy reload, the port-binding security check) while still exiting 0.
          # Slurp the remaining body to a temp file and run THAT with stdin
          # pinned to /dev/null, so no child can ever consume the script body —
          # the whole drain class is gone, no per-command `</dev/null` needed.
          __body=$(mktemp) || exit 1; trap 'rm -f "$__body"' EXIT; cat >"$__body" || exit 1; bash "$__body" </dev/null; exit $?

          set -euo pipefail
          # Every file written during this script (including .env, .env.next,
          # .env.bak.*, sparse-checkout overrides) must be owner-only. Fresh
          # Hetzner box defaults umask 0022 → secrets land world-readable.
          umask 077

          # Fail closed: only the two known values are accepted; anything else
          # (a quoting change, a typo) aborts rather than silently skipping —
          # or silently performing — the destructive path.
          case "$REMIGRATE" in
            true|false) ;;
            *) echo "::error::REMIGRATE must be true|false, got '$REMIGRATE'"; exit 1 ;;
          esac
          case "$REMIGRATE_CH" in
            true|false) ;;
            *) echo "::error::REMIGRATE_CH must be true|false, got '$REMIGRATE_CH'"; exit 1 ;;
          esac

          cd /opt/uptimepage
          if [ -n "$HEAD_SHA" ]; then
            # Auto path: pin the working tree to the exact built commit so the
            # on-disk compose/.env/migrations match the image. A later push
            # landing on main mid-build must NOT skew this deploy.
            git fetch --quiet origin "$HEAD_SHA"
            git checkout --quiet --force "$HEAD_SHA"
          else
            # Manual path: operator-chosen tag; take tip of main.
            git pull --ff-only
          fi

          # Ship only prod artifacts to the box. Pre-this, `git pull` landed
          # the entire repo on /opt/uptimepage/, including root
          # docker-compose.yml + compose.dev.yml that bind DBs to 0.0.0.0
          # with default creds — one wrong `cd` + bare `docker compose up`
          # = publicly exposed databases. `reapply` prunes anything outside
          # the allowlist.
          #
          # Critical ordering: `git sparse-checkout init` IMMEDIATELY prunes
          # the working tree to its default pattern (cone-mode `/*` + `!/*/`
          # = root files only, deletes all subdirs incl. `deployment/`). So
          # the allowlist must be read from git objects (`git show HEAD:…`)
          # BEFORE init — reading from the working tree races with the prune.
          # Earlier draft of this block did `cp deployment/sparse-checkout.list`
          # AFTER init and failed with "No such file or directory" on first
          # deploy.
          if ! git show "HEAD:deployment/sparse-checkout.list" > /tmp/sc.list 2>/dev/null; then
            echo "::error::deployment/sparse-checkout.list missing in HEAD — refusing to deploy"
            exit 1
          fi
          git sparse-checkout init --no-cone
          cp /tmp/sc.list .git/info/sparse-checkout
          git sparse-checkout reapply
          rm -f /tmp/sc.list

          cd deployment

          # --- bump UPTIMEPAGE_IMAGE in .env -----------------------------
          # cp backup FIRST; awk in-place rewrite (every line is reprinted, only
          # the target key is substituted — never grep -v | append | mv); then
          # verify the line count is unchanged and the key carries the new value.
          cp .env ".env.bak.$(date +%s)"
          before=$(wc -l < .env)
          awk -v img="$NEW_IMAGE" '
            /^UPTIMEPAGE_IMAGE=/ { print "UPTIMEPAGE_IMAGE=" img; seen=1; next }
            { print }
            END { if (!seen) exit 3 }
          ' .env > .env.next
          mv .env.next .env
          after=$(wc -l < .env)
          [ "$before" = "$after" ] || { echo "::error::.env line count changed $before -> $after"; exit 1; }
          grep -qxF "UPTIMEPAGE_IMAGE=$NEW_IMAGE" .env \
            || { echo "::error::UPTIMEPAGE_IMAGE not set to $NEW_IMAGE"; exit 1; }
          # Keep the 10 most recent backups; prune the rest so deploys don't litter.
          ls -1t .env.bak.* 2>/dev/null | tail -n +11 | xargs -r rm -f

          # --- managed Grafana Cloud metrics env (optional) -----------------
          # Same write contract as the image bump: cp backup FIRST, then a
          # single awk pass reprints EVERY line (never grep -v | append |
          # mv), replacing each managed key in place or appending it if
          # absent. Values arrive via the remote environment (awk ENVIRON
          # / printenv) so they are byte-exact (slash/equals/plus safe) and
          # never enter argv or a `set -x` trace; the run log masks the
          # registered secrets. The whole block is skipped unless all three
          # are set (a half-config must not write empty keys or start a
          # crash-looping sidecar). NOTE: a secret value containing a
          # single quote would break the ssh-arg quoting above — Grafana
          # tokens/URL/id never contain one (same assumption as NEW_IMAGE).
          if [ -n "${GRAFANA_CLOUD_PROM_URL:-}" ] \
             && [ -n "${GRAFANA_CLOUD_PROM_USER:-}" ] \
             && [ -n "${GRAFANA_CLOUD_API_TOKEN:-}" ]; then
            cp .env ".env.bak.$(date +%s).grafana"
            # NR (record count) is trailing-newline-agnostic, unlike wc -l:
            # a .env without a final newline must not false-abort the roll.
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["GRAFANA_CLOUD_PROM_URL"]  = ENVIRON["GRAFANA_CLOUD_PROM_URL"]
                m["GRAFANA_CLOUD_PROM_USER"] = ENVIRON["GRAFANA_CLOUD_PROM_USER"]
                m["GRAFANA_CLOUD_API_TOKEN"] = ENVIRON["GRAFANA_CLOUD_API_TOKEN"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+3 lines may be appended (keys absent before); anything
            # outside that means the reprint dropped/duplicated a line.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 3))" ]; then
              echo "::error::.env line count out of range after grafana upsert (${before} -> ${after})"
              exit 1
            fi
            # Authoritative check: each key present EXACTLY once with the
            # exact value (catches a missed append or a stray duplicate
            # that the coarse line-count bound could mask).
            for k in GRAFANA_CLOUD_PROM_URL GRAFANA_CLOUD_PROM_USER GRAFANA_CLOUD_API_TOKEN; do
              n=$(grep -cxF "${k}=$(printenv "$k")" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
            # No prune here — the image-bump prune above already bounds
            # .env.bak.* to the 10 newest each deploy.
          fi

          # --- managed Grafana Cloud Loki env (optional) --------------------
          # Logs ride the same Alloy sidecar as metrics. The access-policy
          # token is shared (already upserted above as
          # GRAFANA_CLOUD_API_TOKEN — it only needs logs:write added on
          # the policy), so this block carries just the Loki URL + numeric
          # instance id. Same write contract as the metrics block: cp
          # backup FIRST, single awk reprint (never grep -v | append |
          # mv), ENVIRON values, line-count bound, exactly-once verify.
          # Gated on both being set; the Alloy logs pipeline stays inert
          # (config.alloy resolves an unreachable placeholder URL) until
          # they are, so a half-config never disturbs metrics.
          if [ -n "${GRAFANA_CLOUD_LOKI_URL:-}" ] \
             && [ -n "${GRAFANA_CLOUD_LOKI_USER:-}" ]; then
            cp .env ".env.bak.$(date +%s).loki"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["GRAFANA_CLOUD_LOKI_URL"]  = ENVIRON["GRAFANA_CLOUD_LOKI_URL"]
                m["GRAFANA_CLOUD_LOKI_USER"] = ENVIRON["GRAFANA_CLOUD_LOKI_USER"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2 lines may be appended (both keys absent before).
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after loki upsert (${before} -> ${after})"
              exit 1
            fi
            for k in GRAFANA_CLOUD_LOKI_URL GRAFANA_CLOUD_LOKI_USER; do
              n=$(grep -cxF "${k}=$(printenv "$k")" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- managed in-app OTLP trace env (optional) ---------------------
          # Same write contract as the metrics block: cp backup FIRST, one
          # awk pass reprinting EVERY line (never grep -v | append | mv),
          # values via ENVIRON so they are byte-exact and never enter argv
          # or a trace. Presence of all three connection values is the
          # enable signal — the two on/off flags are then forced true.
          # compose defaults both flags false, so dropping the secrets
          # turns tracing back off on the next deploy. A half-config
          # (missing one) writes nothing rather than a broken partial.
          if [ -n "${GRAFANA_OTLP_ENDPOINT:-}" ] \
             && [ -n "${GRAFANA_OTLP_INSTANCE_ID:-}" ] \
             && [ -n "${GRAFANA_OTLP_API_TOKEN:-}" ]; then
            cp .env ".env.bak.$(date +%s).otlp"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["GRAFANA_OTLP_ENDPOINT"]          = ENVIRON["GRAFANA_OTLP_ENDPOINT"]
                m["GRAFANA_OTLP_INSTANCE_ID"]       = ENVIRON["GRAFANA_OTLP_INSTANCE_ID"]
                m["GRAFANA_OTLP_API_TOKEN"]         = ENVIRON["GRAFANA_OTLP_API_TOKEN"]
                m["GRAFANA_OTLP_ENABLED"]           = "true"
                m["UPTIMEPAGE_TRACING_ENABLED"] = "true"
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+5 lines may be appended (all five keys absent before).
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 5))" ]; then
              echo "::error::.env line count out of range after otlp upsert (${before} -> ${after})"
              exit 1
            fi
            for k in GRAFANA_OTLP_ENDPOINT GRAFANA_OTLP_INSTANCE_ID GRAFANA_OTLP_API_TOKEN; do
              n=$(grep -cxF "${k}=$(printenv "$k")" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
            for k in GRAFANA_OTLP_ENABLED UPTIMEPAGE_TRACING_ENABLED; do
              n=$(grep -cxF "${k}=true" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- managed RUST_LOG (optional) ----------------------------------
          # Non-secret log/trace filter, sourced from the repo *variable*
          # RUST_LOG (vars, not secrets). Same write contract as the blocks
          # above: cp backup FIRST, single awk reprint (never grep -v |
          # append | mv), ENVIRON value, line-count bound, exactly-once
          # verify. Skipped when the variable is unset so the compose
          # `${RUST_LOG:-debug}` fallback governs; setting it lets an
          # operator retune verbosity with only a redeploy (no rebuild).
          if [ -n "${RUST_LOG:-}" ]; then
            cp .env ".env.bak.$(date +%s).rustlog"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN { m["RUST_LOG"] = ENVIRON["RUST_LOG"] }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+1: appended only if RUST_LOG was absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 1))" ]; then
              echo "::error::.env line count out of range after rustlog upsert (${before} -> ${after})"
              exit 1
            fi
            n=$(grep -cxF "RUST_LOG=$(printenv RUST_LOG)" .env || true)
            [ "$n" = 1 ] || { echo "::error::RUST_LOG not written exactly once to .env (count=${n})"; exit 1; }
          fi

          # --- managed MCP enable flags (optional) --------------------------
          # Non-secret on/off flags, sourced from the repo *variables*
          # MCP_ENABLED / MCP_OAUTH_ENABLED (passed as UPTIMEPAGE_MCP_ENABLED /
          # UPTIMEPAGE_MCP_OAUTH_ENABLED). Same write contract as the blocks
          # above: cp backup FIRST, single awk reprint, ENVIRON values,
          # line-count bound, exactly-once verify. Runs when either is set;
          # an unset flag is written as its (possibly empty) value, which the
          # compose `${…:-false}` fallback reads as false. NOTE: with OAuth on,
          # the app refuses to boot unless UPTIMEPAGE_AUTH_PUBLIC_BASE_URL is a
          # real https origin — keep that set before flipping MCP_OAUTH_ENABLED.
          if [ -n "${UPTIMEPAGE_MCP_ENABLED:-}" ] \
             || [ -n "${UPTIMEPAGE_MCP_OAUTH_ENABLED:-}" ]; then
            cp .env ".env.bak.$(date +%s).mcp"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_MCP_ENABLED"]       = ENVIRON["UPTIMEPAGE_MCP_ENABLED"]
                m["UPTIMEPAGE_MCP_OAUTH_ENABLED"] = ENVIRON["UPTIMEPAGE_MCP_OAUTH_ENABLED"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2 lines may be appended (both keys absent before).
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after mcp upsert (${before} -> ${after})"
              exit 1
            fi
            for k in UPTIMEPAGE_MCP_ENABLED UPTIMEPAGE_MCP_OAUTH_ENABLED; do
              n=$(grep -cxF "${k}=$(printenv "$k")" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # Defensive fallback: tighten .env perms in case the file predates
          # the umask 077 at the top of this script (umask only affects NEW
          # files; a .env written by a pre-this-commit deploy stays 0644).
          # Backups inherit perms from `cp .env …` which is 0600 now, so no
          # explicit chmod needed for .env.bak.*.
          chmod 600 .env

          # --- pull the new image FIRST -------------------------------------
          # Slow, network-fragile step. Do it while the OLD container still
          # serves: if the ssh session dies here the site stays up on the old
          # image. (Pulling AFTER stop+drop once left prod 502 with an empty
          # DB when a session truncated mid-pull.)
          #
          # Authenticate to GHCR so the pull works with the package kept
          # private (org policy). The job's GITHUB_TOKEN carries packages:read;
          # the login is ephemeral (token dies with the run).
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull uptimepage

          # --- optional destructive re-migrate (Postgres only) ---------------
          # Now the cutover is fast: stop, drop, recreate, restart in seconds.
          if [ "$REMIGRATE" = "true" ]; then
            echo "remigrate: stopping app + dropping Postgres database 'monitor'"
            docker compose stop uptimepage
            docker compose exec -T postgres sh -c \
              'PGPASSWORD="$POSTGRES_PASSWORD" psql -U monitor -d postgres -v ON_ERROR_STOP=1 \
                 -c "DROP DATABASE IF EXISTS monitor WITH (FORCE);" \
                 -c "CREATE DATABASE monitor OWNER monitor;"'
          fi

          # --- optional destructive ClickHouse re-migrate (volume drop) ------
          # CH has no DROP DATABASE cutover like PG; a clean slate means
          # removing the data volume so the server re-inits (CLICKHOUSE_DB
          # auto-creates) and the app re-applies CH migrations on connect.
          if [ "$REMIGRATE_CH" = "true" ]; then
            echo "remigrate-ch: dropping the ClickHouse data volume"
            # Project name off a still-running container (the compose project is
            # `uptimepage`, not the dir) → the volume is <project>_clickhouse_data.
            proj=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$(docker compose ps -q postgres)")
            docker compose stop uptimepage clickhouse
            docker compose rm -f clickhouse
            docker volume rm "${proj}_clickhouse_data"
            # Bind-mounted CH config must stay world-readable (0644): container
            # UID 101 can't read 0600 host files → silent boot loop on a fresh
            # volume. cwd is /opt/uptimepage/deployment (the config lives here).
            chmod 644 clickhouse-config.xml clickhouse-users.xml 2>/dev/null || true
            docker compose up -d clickhouse
          fi

          # Scope the recreate to the app so a compose change never silently
          # recreates postgres/caddy as a side effect of the roll. When the
          # OTLP trace creds are managed here, --force-recreate for the same
          # reason the alloy line below uses it: a token rotation on an
          # unchanged image tag would otherwise keep the old container with
          # stale trace env. A normal deploy bumps the image and recreates
          # anyway, so this only bites the same-tag re-enable/rotate path.
          if [ -n "${GRAFANA_OTLP_ENDPOINT:-}" ] \
             && [ -n "${GRAFANA_OTLP_INSTANCE_ID:-}" ] \
             && [ -n "${GRAFANA_OTLP_API_TOKEN:-}" ]; then
            docker compose up -d --no-build --force-recreate uptimepage
          else
            docker compose up -d --no-build uptimepage
          fi

          # Caddy: bind-mounted Caddyfile. A `git checkout` of a deploy
          # that edits the file leaves the running container reading the
          # OLD inode (single-file bind mounts pin at mount time, and a
          # `caddy reload` then sees "config is unchanged"). Detect drift
          # by hashing the file on disk vs inside the container; recreate
          # only when they differ. Quiet on no-op deploys; fixes the file
          # without manual `docker compose restart caddy` when it changed.
          host_hash=$(sha256sum Caddyfile 2>/dev/null | awk '{print $1}')
          # Capture the container read's real exit status — don't pipe straight
          # into awk (awk exits 0 and would mask a failed exec) — and keep stderr
          # off the captured stdout (a compose warning would corrupt the hash).
          # On failure, warn and fall through with an empty hash → forces a
          # recreate (safe default) instead of silently skipping it.
          if ctr_line=$(docker compose exec -T caddy sha256sum /etc/caddy/Caddyfile 2>/dev/null); then
            ctr_hash=$(printf '%s' "$ctr_line" | awk '{print $1}')
          else
            echo "::warning::could not read Caddyfile from caddy container; recreating to be safe"
            ctr_hash=""
          fi
          if [ -n "$host_hash" ] && [ "$host_hash" != "$ctr_hash" ]; then
            echo "Caddyfile drift (host=${host_hash:0:12} ctr=${ctr_hash:0:12}); recreating caddy"
            docker compose up -d --no-build --force-recreate caddy
          fi

          # Metrics+logs sidecar: profile-gated, scoped to `alloy` so the
          # app / postgres / caddy are never recreated as a side effect.
          # Same all-three-metrics-creds gate as the .env upsert (logs ride
          # this same container, so the metrics trio is the prerequisite —
          # a Loki-only config never starts the sidecar). --force-recreate
          # so a credential rotation OR a newly-set Loki pair in this
          # deploy actually takes effect (without it `up -d` keeps the old
          # container + stale env); it recreates ONLY alloy — a few seconds
          # of metrics gap, no app impact.
          if [ -n "${GRAFANA_CLOUD_PROM_URL:-}" ] \
             && [ -n "${GRAFANA_CLOUD_PROM_USER:-}" ] \
             && [ -n "${GRAFANA_CLOUD_API_TOKEN:-}" ]; then
            docker compose --profile metrics up -d --no-build --force-recreate alloy
          fi

          docker compose ps

          # Defense in depth: assert internal services carry NO host port
          # bindings. Prod compose uses `expose:` (network-internal only) for
          # postgres/clickhouse/uptimepage; only caddy publishes 80/443.
          # A silent `ports:` edit on postgres/clickhouse would bind DBs to
          # 0.0.0.0 with default monitor/monitor creds = public DB; on the
          # app it would bypass Caddy TLS + expose unauthenticated /metrics
          # on 9090. Fail the deploy so the bad change can't reach steady
          # state unnoticed. `docker compose ps -q` uses the live project
          # name + handles replicas, so it doesn't bit-rot if the project
          # is renamed or scaled.
          for svc in postgres clickhouse uptimepage; do
            for ctr in $(docker compose ps -q "$svc"); do
              bound=$(docker port "$ctr" 2>/dev/null || true)
              if [ -n "$bound" ]; then
                echo "::error::${svc} ($ctr) has host port bindings — must use 'expose:' only:"
                echo "$bound"
                exit 1
              fi
            done
          done
          REMOTE

      - name: health gate
        run: |
          set -euo pipefail
          # Probe /healthz through Caddy from the box (loopback via --resolve so
          # the real cert for app.uptimepage.dev is validated, not bypassed)
          # until the freshly booted app has applied migrations. Fail loud so a
          # bad deploy is never silent.
          ssh -T -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          # Same heredoc-over-stdin slurp-reexec as the deploy step (see there
          # for the rationale): run the body from a temp file with stdin pinned
          # to /dev/null so a future exec here can't drain the probe loop.
          __body=$(mktemp) || exit 1; trap 'rm -f "$__body"' EXIT; cat >"$__body" || exit 1; bash "$__body" </dev/null; exit $?

          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 \
                 --resolve app.uptimepage.dev:443:127.0.0.1 \
                 https://app.uptimepage.dev/healthz >/dev/null 2>&1; then
              echo "healthy after ${i} attempt(s)"; exit 0
            fi
            [ "$i" -lt 30 ] && sleep 5
          done
          echo "::error::app did not become healthy within ~150s"
          cd /opt/uptimepage/deployment && docker compose logs --tail=80 uptimepage || true
          exit 1
          REMOTE

      - name: annotate grafana (optional)
        env:
          ANNO_URL: ${{ secrets.GRAFANA_ANNOTATIONS_URL }}
          ANNO_TOKEN: ${{ secrets.GRAFANA_ANNOTATIONS_TOKEN }}
        run: |
          set -euo pipefail
          # Drop a deploy marker on Grafana so a latency / error-rate
          # shift can be read against "this is the commit that did it".
          # Posted from the runner (Grafana HTTP API, not the box).
          # Inert until both secrets are set — mirrors the metrics/Loki
          # gates. NOTE: ANNO_TOKEN is a Grafana *service-account* token
          # with the annotations:write role — NOT the glc_ ingest token
          # (that one only writes Mimir/Loki/Tempo, not the Grafana API).
          # No `if:` needed — a step runs only on prior success by default.
          if [ -z "${ANNO_URL:-}" ] || [ -z "${ANNO_TOKEN:-}" ]; then
            echo "grafana annotation skipped (secrets unset)"; exit 0
          fi
          ts=$(date +%s%3N)
          # `|| true`: a transport failure (curl non-zero exit — DNS / TLS
          # / connection, NOT an HTTP status) must not trip `set -e` and
          # fail an otherwise-healthy deploy. This step is best-effort:
          # it can warn, never fail the job.
          code=$(curl -sS -o /tmp/anno.out -w '%{http_code}' \
            -X POST "$ANNO_URL" \
            -H "Authorization: Bearer ${ANNO_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "{\"time\":${ts},\"tags\":[\"deploy\",\"uptimepage\",\"prod\"],\"text\":\"deploy ${IMAGE_TAG}\"}" || true)
          if [ -z "$code" ] || [ "$code" = 000 ]; then
            echo "::warning::grafana annotation: curl transport failure (deploy unaffected)"
            exit 0
          fi
          if [ "$code" = 200 ]; then
            echo "grafana annotation posted (${IMAGE_TAG})"
          else
            echo "::warning::grafana annotation POST ${code}: $(head -c 300 /tmp/anno.out 2>/dev/null || true)"
          fi
