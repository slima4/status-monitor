[book]
title = "uptimepage"
description = "Async Rust health-check service — architecture, API, configuration, metrics, deployment."
authors = ["uptimepage authors"]
language = "en"
src = "docs"

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/uptimepage/uptimepage"
edit-url-template = "https://github.com/uptimepage/uptimepage/edit/main/{path}"
site-url = "/uptimepage/"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[output.html.fold]
enable = true
level = 1

[output.linkcheck2]
follow-web-links = false
traverse-parent-directories = false
warning-policy = "error"
