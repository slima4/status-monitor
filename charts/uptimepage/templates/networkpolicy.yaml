{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uptimepage.fullname" . }}
  labels:
    {{- include "uptimepage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "uptimepage.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: {{ .Values.service.metricsPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # Unrestricted on purpose: narrowing it makes checks look like target outages.
  egress:
    - {}
{{- end }}
