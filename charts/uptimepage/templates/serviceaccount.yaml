{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uptimepage.serviceAccountName" . }}
  labels:
    {{- include "uptimepage.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
