{{- include "uptimepage.validate" . }}
{{- $data := dict }}
{{- if and .Values.postgresql.url (not .Values.postgresql.existingSecret) }}
{{- $_ := set $data "postgres-url" .Values.postgresql.url }}
{{- end }}
{{- if and .Values.clickhouse.password (not .Values.clickhouse.existingSecret) }}
{{- $_ := set $data "clickhouse-password" .Values.clickhouse.password }}
{{- end }}
{{- /* All core keys live together: secrets.existingSecret means the whole set is
       managed elsewhere, so writing half of them here would leave the app
       reading OAuth secrets from a Secret that never received them. */}}
{{- if not .Values.secrets.existingSecret }}
{{- if .Values.secrets.fingerprintSalt }}{{ $_ := set $data "fingerprint-salt" .Values.secrets.fingerprintSalt }}{{ end }}
{{- if .Values.secrets.credentialsKekBase64 }}{{ $_ := set $data "credentials-kek-base64" .Values.secrets.credentialsKekBase64 }}{{ end }}
{{- if .Values.secrets.operatorAdminToken }}{{ $_ := set $data "operator-admin-token" .Values.secrets.operatorAdminToken }}{{ end }}
{{- if .Values.auth.github.clientSecret }}{{ $_ := set $data "github-client-secret" .Values.auth.github.clientSecret }}{{ end }}
{{- if .Values.auth.google.clientSecret }}{{ $_ := set $data "google-client-secret" .Values.auth.google.clientSecret }}{{ end }}
{{- if .Values.auth.microsoft.clientSecret }}{{ $_ := set $data "microsoft-client-secret" .Values.auth.microsoft.clientSecret }}{{ end }}
{{- if .Values.email.resend.apiKey }}{{ $_ := set $data "resend-api-key" .Values.email.resend.apiKey }}{{ end }}
{{- if .Values.email.resend.webhookSecret }}{{ $_ := set $data "resend-webhook-secret" .Values.email.resend.webhookSecret }}{{ end }}
{{- end }}
{{- range .Values.probes }}
{{- if and .token (not .existingSecret) }}
{{- $_ := set $data (printf "probe-%s-token" .name) .token }}
{{- end }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uptimepage.fullname" . }}-env
  labels:
    {{- include "uptimepage.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
