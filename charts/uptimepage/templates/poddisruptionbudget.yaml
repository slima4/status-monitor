{{- if .Values.podDisruptionBudget.enabled }}
# Single replica: this blocks drains only, it cannot add availability.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "uptimepage.fullname" . }}
  labels:
    {{- include "uptimepage.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "uptimepage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
{{- end }}
