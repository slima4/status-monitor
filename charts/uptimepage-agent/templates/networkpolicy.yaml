{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uptimepage-agent.fullname" . }}
  labels:
    {{- include "uptimepage-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "uptimepage-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Metrics scrape only. Nothing else needs to reach an agent.
  ingress:
    - ports:
        - port: {{ .Values.metricsPort }}
          protocol: TCP
  # Unrestricted by design: narrowing it turns healthy targets into false outages.
  egress:
    - {}
{{- end }}
