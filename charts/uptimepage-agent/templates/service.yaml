{{- if .Values.metrics.serviceMonitor.enabled }}
# Headless, metrics only: the agent accepts no inbound API traffic.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uptimepage-agent.fullname" . }}
  labels:
    {{- include "uptimepage-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "uptimepage-agent.selectorLabels" . | nindent 4 }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "uptimepage-agent.fullname" . }}
  labels:
    {{- include "uptimepage-agent.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "uptimepage-agent.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_uptimepage_dev_region]
          targetLabel: region
{{- end }}
