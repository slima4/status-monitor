# Production stack for status-monitor
#
# Layout:
#   Internet → Caddy (TLS, rate-limit) → status-monitor (no public ports)
#                                      → PostgreSQL  (no public ports)
#                                      → ClickHouse  (no public ports)
#
# In SaaS, authentication is enforced by the app (GitHub OAuth session), not
# at the edge (self-host has no operator auth of its own — keep it private).
# Only Caddy publishes ports to the host; everything else is reachable only
# on the internal docker network. This is the single most important
# defense-in-depth property: even if a session is compromised, the databases
# are never exposed.
#
# Required env vars in .env (see .env.example):
#   STATUS_MONITOR_DOMAIN, STATUS_MONITOR_ACME_EMAIL, HETZNER_DNS_API_TOKEN,
#   POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD, STATUS_MONITOR_CREDENTIALS_KEK_BASE64

name: status-monitor

services:
  caddy:
    # Custom image: stock caddy:2-alpine lacks the Hetzner DNS-01 solver
    # (wildcard cert) and the rate-limit plugin. Built automatically.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: status-monitor-caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      STATUS_MONITOR_DOMAIN: ${STATUS_MONITOR_DOMAIN}
      STATUS_MONITOR_ACME_EMAIL: ${STATUS_MONITOR_ACME_EMAIL}
      HETZNER_DNS_API_TOKEN: ${HETZNER_DNS_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certs + keys — back this up!
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      status-monitor:
        condition: service_started
    healthcheck:
      # Caddy's admin API (plaintext, always up while Caddy runs). Use the
      # IPv4 literal: Caddy binds admin on 127.0.0.1 only, but `localhost`
      # resolves to ::1 first in this image → connection refused. Probing
      # the public :80 instead would 308→https and then fail TLS (no cert
      # for the SNI).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  status-monitor:
    # Build from repo root by default; override with a pre-built image by setting
    # STATUS_MONITOR_IMAGE=ghcr.io/you/status-monitor:v1.2.3 in .env.
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${STATUS_MONITOR_IMAGE:-status-monitor:latest}
    restart: unless-stopped
    # No `ports:` — only reachable via the internal network.
    expose:
      - "8080"   # API + UI
      - "9090"   # Prometheus metrics (scrape on internal network only)
    environment:
      STATUS_MONITOR_STORAGE__POSTGRES__URL: postgres://monitor:${POSTGRES_PASSWORD}@postgres:5432/monitor
      STATUS_MONITOR_STORAGE__CLICKHOUSE__URL: http://clickhouse:8123
      STATUS_MONITOR_STORAGE__CLICKHOUSE__USER: default
      STATUS_MONITOR_STORAGE__CLICKHOUSE__PASSWORD: ${CLICKHOUSE_PASSWORD}
      STATUS_MONITOR_STORAGE__CLICKHOUSE__DATABASE: monitor
      STATUS_MONITOR_SECURITY__CREDENTIALS_KEK_BASE64: ${STATUS_MONITOR_CREDENTIALS_KEK_BASE64}
      STATUS_MONITOR_OBSERVABILITY__LOG_FORMAT: json
      # Tenancy / public-status surface. Defaults are self-host (single org,
      # /status on the operator host). For the SaaS wildcard surface set
      # these in .env — see .env.example "Per-org status pages (SaaS)".
      # base_domain reuses STATUS_MONITOR_DOMAIN (it must equal the Caddy
      # base domain so {slug}.status.{domain} resolves); unused unless
      # SUBDOMAIN_PUBLIC_ROUTES is true.
      STATUS_MONITOR_TENANCY__ENABLED: ${STATUS_MONITOR_TENANCY_ENABLED:-false}
      STATUS_MONITOR_TENANCY__PATH_BASED_PUBLIC_ROUTES: ${STATUS_MONITOR_PATH_BASED_PUBLIC_ROUTES:-true}
      STATUS_MONITOR_TENANCY__SUBDOMAIN_PUBLIC_ROUTES: ${STATUS_MONITOR_SUBDOMAIN_PUBLIC_ROUTES:-false}
      STATUS_MONITOR_PUBLIC_STATUS__BASE_DOMAIN: ${STATUS_MONITOR_DOMAIN}
      # Session-fingerprint salt. REQUIRED once tenancy is enabled (SaaS):
      # the app refuses to boot with an empty salt. Empty in self-host is
      # fine (the guard only fires when tenancy is on).
      STATUS_MONITOR_AUTH__FINGERPRINT_SALT: ${STATUS_MONITOR_AUTH_FINGERPRINT_SALT:-}
      # GitHub OAuth — the operator login method (the app owns auth; there is
      # no edge basic_auth). client_id is public; client_secret is a secret.
      # redirect_url must exactly match the OAuth App's callback URL;
      # public_base_url is the external origin used to build OAuth/redirect
      # and emailed links.
      STATUS_MONITOR_AUTH__GITHUB__CLIENT_ID: ${STATUS_MONITOR_AUTH_GITHUB_CLIENT_ID:-}
      STATUS_MONITOR_AUTH__GITHUB__CLIENT_SECRET: ${STATUS_MONITOR_AUTH_GITHUB_CLIENT_SECRET:-}
      STATUS_MONITOR_AUTH__GITHUB__REDIRECT_URL: ${STATUS_MONITOR_AUTH_GITHUB_REDIRECT_URL:-}
      STATUS_MONITOR_AUTH__PUBLIC_BASE_URL: ${STATUS_MONITOR_AUTH_PUBLIC_BASE_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # No container-level healthcheck: the runtime image is distroless
    # (no shell, no wget, no curl). Caddy probes /healthz actively via
    # `health_uri` in the reverse_proxy block — see Caddyfile.

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    restart: unless-stopped
    expose:
      - "8123"   # HTTP
      - "9000"   # native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Constrain RAM — see ./clickhouse-config.xml
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: uncomment to enable internal Prometheus scraping
  # prometheus:
  #   image: prom/prometheus:latest
  #   restart: unless-stopped
  #   expose:
  #     - "9091"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.retention.time=30d'

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  postgres_data:
  clickhouse_data:
  # prometheus_data:
