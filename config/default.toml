[server]
# Default to loopback. API has no auth in v1; operators must explicitly opt-in
# to non-loopback binds.
api_bind = "127.0.0.1:8080"
metrics_bind = "127.0.0.1:9090"

[runtime]
worker_threads = 0              # 0 = auto (num_cpus)
max_blocking_threads = 16

[checker]
max_concurrent_checks = 50000
default_timeout_ms = 10000
connect_timeout_ms = 5000
default_check_interval_secs = 120

[http_client]
pool_max_idle_per_host = 100
pool_idle_timeout_secs = 90
tcp_keepalive_secs = 60
http2_keep_alive_interval_secs = 30
http2_keep_alive_timeout_secs = 10
http2_keep_alive_while_idle = true
user_agent = "StatusMonitor/1.0"

[dns]
cache_size = 50000
positive_ttl_secs = 300
negative_ttl_secs = 60
servers = ["1.1.1.1:53", "8.8.8.8:53"]

[security]
# SSRF guard — see docs/configuration.md.
allow_private_targets = false
# 32-byte KEK base64 (`openssl rand -base64 32`). When empty, basic_auth and
# bearer_token are stored plaintext in check_spec — dev-only.
credentials_kek_base64 = ""

[circuit_breaker]
failure_threshold = 5
success_threshold = 2
open_duration_secs = 60
half_open_max_calls = 3

[storage.postgres]
url = "postgres://monitor:monitor@localhost:5432/monitor"
max_connections = 10
min_connections = 2
acquire_timeout_secs = 10

[storage.clickhouse]
url = "http://localhost:8123"
database = "monitor"
user = "monitor"
password = "monitor"
batch_size = 1000
batch_timeout_ms = 500
buffer_size = 100000

[scheduler]
target_refresh_interval_secs = 30
jitter_pct = 10

[observability]
log_level = "info"
log_format = "json"
metrics_enabled = true
tracing_enabled = false
otlp_endpoint = "http://localhost:4317"
gauge_sample_interval_ms = 1000

# Per-IP API rate limiting is enforced by Caddy (see deployment/Caddyfile);
# the in-process limiter is per-org / per-user — see [rate_limits] + plans.

# Outbound notification channels. Per-target opt-in via the target's `alerts`
# field references the channel by key; entries here only define transport
# credentials. Channels marked `enabled = false` cause target opt-ins to no-op.
[notifications.slack]
enabled = false
webhook_url = ""

[notifications.webhook]
enabled = false
url = ""

[notifications.email]
enabled = false
smtp_host = ""
smtp_port = 587
smtp_user = ""
smtp_password = ""
from = ""
# When true, opens a plain TCP connection and upgrades to TLS via STARTTLS.
# When false, opens an implicit-TLS connection on smtp_port (typically 465).
starttls = true

[api.cors]
# Browser CORS for /api/v1/*. Disabled by default. When enabled, every entry in
# `allowed_origins` must be a full origin (scheme://host[:port]); wildcards are
# only honored when `allow_any_origin = true`.
enabled = false
allowed_origins = []
allowed_methods = ["GET", "POST", "PATCH", "DELETE"]
allow_any_origin = false

[tenancy]
# false = single-tenant self-host (default org owns all data).
# true  = multi-tenant SaaS (org resolved from authenticated session).
enabled = false
# Slug used to find or create the default org at startup. The id is generated
# by Postgres and persisted; only the slug is configurable.
default_org_slug = "default"
# Path-based public surface (`/status`, `/api/public/v1/*` on the operator
# host). Defaults to `!tenancy.enabled` — self-host serves the single org's
# status page at the operator host; SaaS does not (it would expose the
# default org's data to every tenant). Leave commented to use the default.
# path_based_public_routes = true
# Wildcard subdomain public surface (`*.status.{public_status.base_domain}`).
# Defaults to false. Set true together with `tenancy.enabled = true` and a
# well-formed `public_status.base_domain` to serve per-org status pages.
# subdomain_public_routes = false
# Free-tier cap on orgs a single user can own.
free_tier_owner_org_limit = 3
# Grace period before soft-deleted orgs are purged.
deletion_grace_period_days = 30

# `base_domain` is required when tenancy.subdomain_public_routes = true; the
# startup assertion refuses to boot without it (would let the slug extractor
# match arbitrary Host headers).
[public_status]
base_domain = ""
cache_max_orgs = 1000
cache_ttl_secs = 10
last_good_ttl_secs = 3600
logo_dir = "/var/lib/status-monitor/logos"
max_logo_size_bytes = 204800
allowed_logo_mime_types = ["image/png", "image/jpeg", "image/webp"]
max_logo_dimension_px = 1200
default_brand_color = "#3b82f6"
default_show_powered_by = true
# Second line of defence behind the Caddy-side limit.
public_per_ip_rate_limit_per_min = 60

# Transactional product email (org invitations, magic-link sign-in). Distinct
# from [notifications.email], which is the outage-alert SMTP channel.
[email]
# "resend" | "log" | "memory". Dev default is "log" so `cargo run` works with
# no external accounts — action URLs are printed to tracing.
provider = "log"
from_name = "Status Monitor"
from_address = "no-reply@example.invalid"

[email.resend]
# From https://resend.com/api-keys. Required when provider = "resend".
api_key = ""

[auth]
# Currently shipped sign-in methods. Add "magic_link" to enable magic-link
# email login once the request/verify endpoints are wired.
enabled_methods = ["github_oauth"]
# Salt for hashing IPs / user-agents in login_attempts + sessions.
# GENERATE WITH: openssl rand -base64 32
# LOAD-BEARING: rotating this re-fragments anomaly-detection windows. The
# startup guard refuses to boot on a mismatch unless
# STATUS_MONITOR_AUTH_ACCEPT_SALT_ROTATION=1 is set.
fingerprint_salt = ""

[auth.session]
idle_timeout_days = 30
absolute_timeout_days = 90
cookie_name = "_sm_session"
cookie_secure = true
cookie_domain = ""
renew_on_use = true

[auth.github]
client_id = ""
client_secret = ""
redirect_url = ""
scopes = ["user:email", "read:user"]
http_connect_timeout_ms = 5000
http_request_timeout_ms = 10000

[auth.invitations]
expiry_hours = 168
# Pending-invitation cap now lives in plans.max_pending_invitations.

[auth.api_tokens]
# Per-user token cap now lives in plans.max_api_tokens_per_user.
# Floor of 16 chars = 48 bits of entropy in the visible prefix (collision-safe
# to ~16M tokens). Startup assertion refuses to boot below that.
prefix_visible_chars = 16

[auth.magic_link]
expiry_minutes = 15
rate_limit_seconds = 60

[quotas]
# Cache TTLs for plan / usage lookups (consumed in a later phase).
plan_cache_ttl_secs = 300
usage_cache_ttl_secs = 10

# Self-host single-tenant limit overrides. Only applied when
# tenancy.enabled = false; ignored in SaaS mode. Each cap is optional and
# falls back to the plan default when unset. Uncomment to raise limits.
[quotas.self_host_overrides]
enabled = false
# max_targets = 10000
# min_check_interval_secs = 5
# retention_days = 365
# max_members = 100
# max_pending_invitations = 100
# max_api_tokens_per_user = 50
# max_public_components = 10000
# max_maintenance_windows = 1000
# max_logo_size_bytes = 1048576

[rate_limits]
# Per-org / per-user limits come from the plans table. These mirror the
# per-IP numbers Caddy enforces (here for ops parity) and the in-process
# limiter-map janitor cadence.
[rate_limits.per_ip]
public_pages_per_min = 60
auth_endpoints_per_min = 10
org_creations_per_day = 3

[rate_limits.janitor]
cleanup_interval_hours = 6
idle_threshold_hours = 24

[abuse]
# Case-insensitive regex patterns. A target URL matching any of these is
# rejected at creation. Conservative: these are attack-recon paths, never
# legitimate monitoring targets. A customer who genuinely needs one can ask
# support for an exemption.
url_patterns_denied = [
    "/\\.git(/|$)",
    "/\\.env(/|$)",
    "/phpmyadmin",
    "/wp-admin",
    "/wp-login",
    "/cgi-bin/",
    "/.well-known/security.txt",
    "\\.(php|jsp|asp|aspx)\\?",
]
# Domain deny-list (YAML). Loaded once at startup; edits need a restart
# (hot_reload is reserved for v1.x).
domain_denylist_path = "config/abuse_denylist.yaml"
hot_reload_enabled = false
