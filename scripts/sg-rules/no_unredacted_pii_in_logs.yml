id: no-unredacted-pii-in-logs
language: rust
severity: error
message: |-
  This tracing/log macro interpolates a value that looks like a raw IP,
  email, URL, slug, recovery token or secret. Hash or redact it first
  (fingerprint::hash_fingerprint, masking, prefix-truncation), or — if it
  is provably not data-subject data — put an inline `// SAFE: <reason>`
  comment *inside* the macro call.
note: |-
  Structural + value-aware: matches a `tracing::$LEVEL!`
  call regardless of rustfmt line-splitting, and flags a `.ip()` /
  `.peer_addr()` / `.remote_addr()` call or an interpolated
  field/binding/format-placeholder named one of: email url slug token
  secret password api_key bearer kek recovery ip addr peer_addr
  remote_addr socket_addr. Escape hatch: an inline `// SAFE:` comment in
  the macro call (same spirit as the tenant-isolation scan's allow-list).
rule:
  all:
    - kind: macro_invocation
    - regex: '(?s)^\s*(tracing\s*::\s*)?(info|warn|error|debug|trace)\s*!'
    - regex: '(?s)(\.ip\s*\(\s*\)|\.peer_addr\s*\(|\.remote_addr\s*\(|[%?]\s*(email|url|slug|token|secret|password|api_key|bearer|kek|recovery|ip|addr|peer_addr|remote_addr|socket_addr)\b|\b(email|url|slug|token|secret|password|api_key|bearer|kek|recovery|ip|addr|peer_addr|remote_addr|socket_addr)\s*=|\{[^{}]*\b(email|url|slug|token|secret|password|api_key|bearer|kek|recovery|ip|addr|peer_addr|remote_addr|socket_addr)\b[^{}]*\})'
  not:
    regex: 'SAFE:'
