# Dev stack. Two modes:
#
# 1. Native binary (default — fastest, ~3 s incremental):
#       docker compose -f compose.dev.yml up -d
#       cargo run --bin status-monitor
#    config/default.toml already points at localhost:5432 and localhost:8123.
#
# 2. status-monitor inside docker with live reload (cargo-watch, ~3 s after
#    the first warm-up; rebuilds happen in-container against a cached target/):
#       docker compose -f compose.dev.yml --profile dev-app up -d --build
#       docker compose -f compose.dev.yml logs -f status-monitor
#    Don't run both modes at once — port 8080 will conflict.
#
# Tear down (keeps volumes):
#   docker compose -f compose.dev.yml down
# Tear down + wipe data:
#   docker compose -f compose.dev.yml down -v
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: monitor
      CLICKHOUSE_PASSWORD: monitor
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data_dev:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Live-reload container. Opt in via `--profile dev-app`. Bind-mounts the
  # repo so `cargo watch` sees host edits; named volumes for target/, the
  # cargo registry, and bin/ so build artefacts and the linux Tailwind CLI
  # never collide with host (macOS) equivalents.
  status-monitor:
    profiles: ["dev-app"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    environment:
      STATUS_MONITOR_STORAGE__POSTGRES__URL: postgres://monitor:monitor@postgres:5432/monitor
      STATUS_MONITOR_STORAGE__CLICKHOUSE__URL: http://clickhouse:8123
      STATUS_MONITOR_STORAGE__CLICKHOUSE__USER: monitor
      STATUS_MONITOR_STORAGE__CLICKHOUSE__PASSWORD: monitor
      # Dev mirrors the SaaS deployment: tenancy on, so the owner-gated
      # operator APIs (status-page settings, members, …) behave as in prod.
      # Self-host mode (tenancy off) bypasses the session entirely, so those
      # writes 401 — not what we want to exercise locally. Seed a session
      # with `just dev-login` (scripts/seed-dev-session.sh).
      STATUS_MONITOR_TENANCY__ENABLED: "true"
      # Mirror SaaS: per-subdomain public pages. Path-based is forbidden under
      # tenancy (panics — would serve the default org to every tenant). lvh.me
      # is a public wildcard that resolves *.lvh.me -> 127.0.0.1, so
      # {slug}.status.lvh.me:8080 hits the local stack with no /etc/hosts.
      STATUS_MONITOR_TENANCY__PATH_BASED_PUBLIC_ROUTES: "false"
      STATUS_MONITOR_TENANCY__SUBDOMAIN_PUBLIC_ROUTES: "true"
      STATUS_MONITOR_PUBLIC_STATUS__BASE_DOMAIN: "lvh.me"
      # Tenancy boot guards: ip/ua fingerprint salt is mandatory under SaaS.
      # Fixed dev-only value — never used outside the local stack.
      STATUS_MONITOR_AUTH__FINGERPRINT_SALT: "dev-only-fingerprint-salt-not-for-prod"
      STATUS_MONITOR_OBSERVABILITY__LOG_FORMAT: json
      STATUS_MONITOR_OBSERVABILITY__LOG_LEVEL: "status_monitor=debug,sqlx=warn,hyper=warn,tower_http=info,info"
      STATUS_MONITOR_SERVER__API_BIND: "0.0.0.0:8080"
      STATUS_MONITOR_SERVER__METRICS_BIND: "0.0.0.0:9090"
      # Faster cargo-watch rebuilds: mold (via the bind-mounted
      # .cargo/config.toml musl target) + a persistent sccache volume.
      # Dockerfile.dev apk-installs both.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /sccache
    volumes:
      - .:/usr/src/status-monitor
      - cargo_registry_dev:/usr/local/cargo/registry
      - target_cache_dev:/usr/src/status-monitor/target
      - sccache_dev:/sccache
      # Mask host bin/ so build.rs fetches the linux/alpine tailwindcss.
      - tailwind_bin_dev:/usr/src/status-monitor/bin
    ports:
      - "8080:8080"
      - "9090:9090"

volumes:
  pg_data_dev:
  ch_data_dev:
  cargo_registry_dev:
  target_cache_dev:
  sccache_dev:
  tailwind_bin_dev:
